name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  plugin:
    # Windows is not redundant here. Every hook decides "am I being run, or imported?"
    # by comparing import.meta.url to argv[1], and the two line up only on an
    # unremarkable POSIX path -- so all four hooks were silent no-ops on Windows for
    # the whole 2.5.0/2.6.0 token-guard line, and a Linux-only matrix could not see it.
    # A hook that no-ops exits 0 and looks exactly like "allowed", so nothing else will.
    name: aspen-code plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the digest test suite
        working-directory: plugins/aspen/code
        run: node --test "test/*.test.mjs"

  cowork:
    name: aspen-cowork plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The packaging test builds the real zip, and package-plugin.sh validates what
      # is about to ship with `claude plugin validate`. Without the CLI that test
      # cannot run, and it is the one that catches a manifest a host would refuse
      # to load -- which is how a 519-character description shipped in 0.6.0.
      # `plugin validate` is offline and needs no credentials.
      - name: Install the Claude Code CLI (for `claude plugin validate`)
        run: npm install -g @anthropic-ai/claude-code
      - name: Run the launcher and installer tests
        working-directory: plugins/aspen/cowork
        run: node --test "test/*.test.mjs"
