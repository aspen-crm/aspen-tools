name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  aspencrm-ai:
    name: aspencrm-ai plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The packaging test builds the real zip, and package-plugin.sh validates what
      # is about to ship with `claude plugin validate`. Without the CLI that test
      # cannot run, and it is the one that catches a manifest a host would refuse
      # to load -- which is how a 519-character description once shipped.
      # `plugin validate` is offline and needs no credentials.
      - name: Install the Claude Code CLI (for `claude plugin validate`)
        run: npm install -g @anthropic-ai/claude-code
      - name: Run the manifest, packaging and skill-path tests
        working-directory: plugins/aspen/ai
        run: node --test "test/*.test.mjs"

  codex:
    name: Codex packaging and native loading
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the tested Codex CLI
        run: npm install -g @openai/codex@0.156.0
      - name: Validate Codex plugins
        run: node scripts/validate-plugins.mjs plugins/aspen/ai
      - name: Load skills and hooks through Codex (no model calls)
        run: node scripts/test-codex.mjs
      - name: Build Codex archives
        run: ./scripts/package-plugin.sh plugins/aspen/ai dist codex
      - uses: actions/upload-artifact@v4
        with:
          name: codex-plugins
          path: dist/*-codex.zip
